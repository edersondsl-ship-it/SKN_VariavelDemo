<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKN — Monitor Dosadores</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root { --bg:#162f2e; --accent:#2dd4bf; --dur:1.4s; }

    html, body { width:100%; height:100%; overflow:hidden; font-family:'Poppins',sans-serif; background:var(--bg); }

    /* ── BG LAYERS ── */
    .bg-layer { position:fixed; inset:0; background-size:cover; background-position:center; will-change:transform,opacity; transition:opacity var(--dur) ease; }
    #bgA { z-index:0; opacity:1; }
    #bgB { z-index:0; opacity:0; }

    .overlay {
      position:fixed; inset:0; z-index:1; pointer-events:none;
      background:
        linear-gradient(to bottom, rgba(20,60,55,.6) 0%, transparent 22%, transparent 75%, rgba(20,60,55,.7) 100%),
        radial-gradient(ellipse 70% 70% at 50% 50%, rgba(18,45,43,.08) 0%, rgba(10,28,27,.78) 100%),
        rgba(15,35,33,.5);
    }
    .grid-bg {
      position:fixed; inset:0; z-index:2; pointer-events:none;
      background-image: linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px), linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
      background-size:52px 52px;
    }
    .grain { position:fixed; inset:0; z-index:3; pointer-events:none; opacity:.035; background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>"); background-size:180px; }

    /* ── RINGS ── */
    .rings { position:fixed; top:50%; left:50%; z-index:4; pointer-events:none; }
    .ring  { position:absolute; border-radius:50%; }
    .ring:nth-child(1) { width:340px; height:340px; top:-170px; left:-170px; border:1px solid rgba(45,212,191,.07); animation:ringCW 28s linear infinite; }
    .ring:nth-child(2) { width:660px; height:660px; top:-330px; left:-330px; border:1px solid rgba(45,212,191,.045); animation:ringCCW 44s linear infinite; }
    .ring:nth-child(3) { width:960px; height:960px; top:-480px; left:-480px; border:1px solid rgba(45,212,191,.025); animation:ringCW 62s linear infinite; }
    @keyframes ringCW  { to { transform:rotate( 360deg); } }
    @keyframes ringCCW { to { transform:rotate(-360deg); } }

    /* ── KEN BURNS ── */
    @keyframes kb1 { from{transform:scale(1.00) translate(0%,0%)}    to{transform:scale(1.14) translate(-2.5%,-1.5%)} }
    @keyframes kb2 { from{transform:scale(1.12) translate(1.5%,.5%)}  to{transform:scale(1.00) translate(-1%,1%)} }
    @keyframes kb3 { from{transform:scale(1.05) translate(-2%,1%)}   to{transform:scale(1.13) translate(2%,-1.5%)} }
    @keyframes kb4 { from{transform:scale(1.08) translate(0%,2%)}    to{transform:scale(1.02) translate(-2%,-.5%)} }
    @keyframes kb5 { from{transform:scale(1.00) translate(2%,-1%)}   to{transform:scale(1.12) translate(-1%,1.5%)} }

    /* ── PARTICLES ── */
    .particle { position:fixed; pointer-events:none; z-index:5; background:var(--accent); animation:pFloat var(--pd,6s) var(--del,0s) linear infinite; }
    .particle.dot  { width:var(--sz,2px); height:var(--sz,2px); border-radius:50%; }
    .particle.line { width:var(--sz,14px); height:1px; opacity:.5; }
    .particle.hex  { background:transparent; color:var(--accent); font-size:.5rem; font-weight:600; letter-spacing:1px; white-space:nowrap; opacity:0; }
    @keyframes pFloat { 0%{opacity:0;transform:translate(0,0)} 15%{opacity:var(--op,.6)} 90%{opacity:var(--op,.6)} 100%{opacity:0;transform:translate(var(--dx,0px),-90px)} }

    /* ── CLOCK ── */
    #hud-clock { position:fixed; top:20px; right:32px; z-index:20; color:rgba(255,255,255,.92); font-size:5.8rem; font-weight:800; letter-spacing:8px; font-variant-numeric:tabular-nums; line-height:1; text-shadow:0 0 44px rgba(45,212,191,.65); animation:fadeUp .4s ease 1.2s both; }
    #hud-date  { position:fixed; top:118px; right:32px; z-index:20; text-align:right; animation:fadeUp .4s ease 1.3s both; }
    .hud-date-line1 { font-size:2rem; font-weight:800; color:rgba(255,255,255,.85); letter-spacing:4px; text-shadow:0 0 22px rgba(45,212,191,.4); }
    .hud-date-line2 { font-size:.85rem; font-weight:800; color:rgba(45,212,191,.6); letter-spacing:4px; text-transform:uppercase; margin-top:6px; }
    #conn-status    { font-size:.62rem; font-weight:700; letter-spacing:2px; text-align:right; margin-top:6px; color:rgba(100,116,139,.6); }

    /* ── BRAND BADGE ── */
    #brand-badge {
      position:fixed; top:20px; left:26px; z-index:20;
      padding:1.5px; border-radius:18px; white-space:nowrap;
      background-image:linear-gradient(130deg, rgba(45,212,191,.06) 0%, rgba(45,212,191,.7) 22%, rgba(45,212,191,.06) 50%, rgba(45,212,191,.6) 78%, rgba(45,212,191,.06) 100%);
      background-size:300% 300%;
      animation:badgeFadeIn .5s ease 1.0s both, auroraShift 5s ease-in-out 1.5s infinite;
    }
    .badge-inner { display:flex; align-items:center; gap:14px; background:rgba(14,32,31,.82); border-radius:16.5px; padding:14px 28px; backdrop-filter:blur(22px); box-shadow:inset 0 1px 0 rgba(255,255,255,.08); }
    .badge-icon  { width:28px; height:28px; filter:brightness(20) opacity(.85); }
    .badge-text  { display:flex; flex-direction:column; }
    .badge-title { font-size:1.15rem; font-weight:900; letter-spacing:5px; color:#fff; text-shadow:0 0 18px rgba(45,212,191,.6); }
    .badge-sub   { font-size:.62rem; font-weight:700; letter-spacing:3.5px; text-transform:uppercase; color:rgba(45,212,191,.7); margin-top:2px; }

    @keyframes badgeFadeIn { from{opacity:0} to{opacity:1} }
    @keyframes auroraShift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }

    /* ── VARIÁVEIS ── */
    #cards-wrap {
      position:fixed; inset:0; z-index:10;
      display:flex; align-items:center; justify-content:center;
      padding:0 32px;
    }

    .vars-grid {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
      width:100%;
      max-width:980px;
    }

    .card {
      background:rgba(14,32,31,.72); border:1px solid rgba(45,212,191,.15);
      border-radius:14px; padding:20px 22px 18px;
      backdrop-filter:blur(20px);
      transition:border-color .25s, box-shadow .25s;
      position:relative; overflow:hidden;
    }
    .card::before { content:''; position:absolute; top:0; left:16px; right:16px; height:1.5px; background:linear-gradient(90deg,transparent,rgba(45,212,191,.6),transparent); }
    .card:hover { border-color:rgba(45,212,191,.4); box-shadow:0 0 28px rgba(45,212,191,.1); }
    .card.setpoint { border-color:rgba(96,165,250,.2); }
    .card.setpoint .card-value { color:#93c5fd; text-shadow:0 0 28px rgba(96,165,250,.4); }
    .card.setpoint .card-label { color:rgba(96,165,250,.65); }
    .card.setpoint::before { background:linear-gradient(90deg,transparent,rgba(96,165,250,.5),transparent); }

    .card-label { font-size:.6rem; font-weight:700; text-transform:uppercase; letter-spacing:.12em; color:rgba(45,212,191,.65); margin-bottom:8px; }
    .card-value { font-size:2.6rem; font-weight:800; color:#fff; line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums; text-shadow:0 0 28px rgba(45,212,191,.35); }
    .card-unit  { font-size:.9rem; font-weight:600; color:rgba(45,212,191,.7); margin-left:5px; }

    /* ── FOOTER ── */
    footer { position:fixed; bottom:20px; left:0; right:0; z-index:21; display:flex; align-items:center; justify-content:center; gap:12px; color:rgba(255,255,255,.4); font-size:.72rem; letter-spacing:1.5px; animation:fadeUp .4s ease 1.2s both; }
    footer::before, footer::after { content:''; width:50px; height:1px; background:linear-gradient(to right,transparent,rgba(45,212,191,.3)); }
    footer::after { background:linear-gradient(to left,transparent,rgba(45,212,191,.3)); }
    .ft-esl { color:#fff; font-weight:800; letter-spacing:2px; background:rgba(45,212,191,.1); border:1px solid rgba(45,212,191,.25); border-radius:5px; padding:1px 7px 2px; text-shadow:0 0 10px rgba(45,212,191,.5); }
    .ft-dot { width:3px; height:3px; border-radius:50%; background:rgba(45,212,191,.4); box-shadow:0 0 5px rgba(45,212,191,.4); }
    .ft-ver { color:rgba(45,212,191,.55); font-size:.68rem; font-weight:700; letter-spacing:1.5px; }

    .bg-wm { position:fixed; bottom:10px; right:-28px; width:280px; opacity:.055; filter:brightness(20); pointer-events:none; z-index:6; }

    @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }

    @media (max-width:760px) {
      .vars-grid { grid-template-columns:repeat(2,1fr); }
      #hud-clock { font-size:3.8rem; letter-spacing:5px; }
      #hud-date  { top:88px; }
      .hud-date-line1 { font-size:1.4rem; }
    }
    @media (max-width:480px) {
      .vars-grid { grid-template-columns:1fr; }
      #cards-wrap { padding:0 16px; }
    }
  </style>
</head>
<body>

  <div class="bg-layer" id="bgA"></div>
  <div class="bg-layer" id="bgB"></div>
  <div class="overlay"></div>
  <div class="grid-bg"></div>
  <div class="grain"></div>
  <img src="img/Logo.png" class="bg-wm" alt="">

  <div class="rings">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
  </div>

  <div id="hud-clock">--:--</div>
  <div id="hud-date">
    <div class="hud-date-line1" id="hud-date-d">--</div>
    <div class="hud-date-line2" id="hud-date-m">--- --- ----</div>
    <div id="conn-status">● AGUARDANDO</div>
  </div>

  <div id="brand-badge">
    <div class="badge-inner">
      <img class="badge-icon" src="img/Logo.png" alt="SKN">
      <div class="badge-text">
        <div class="badge-title">SKN</div>
        <div class="badge-sub">Monitor Dosadores</div>
      </div>
    </div>
  </div>

  <!-- CARDS DE VARIÁVEIS -->
  <div id="cards-wrap">
    <div class="vars-grid">
      <div class="card">
        <div class="card-label">Pressão</div>
        <div><span class="card-value" id="val-pressao">--</span><span class="card-unit">bar</span></div>
      </div>
      <div class="card">
        <div class="card-label">Temperatura</div>
        <div><span class="card-value" id="val-temperatura">--</span><span class="card-unit">°C</span></div>
      </div>
      <div class="card">
        <div class="card-label">Vazão</div>
        <div><span class="card-value" id="val-vazao">--</span><span class="card-unit">l/min</span></div>
      </div>
      <div class="card">
        <div class="card-label">pH Medido</div>
        <div><span class="card-value" id="val-ph">--</span><span class="card-unit">pH</span></div>
      </div>
      <div class="card setpoint">
        <div class="card-label">Setpoint pH</div>
        <div><span class="card-value" id="val-setpoint">--</span><span class="card-unit">pH</span></div>
      </div>
      <div class="card">
        <div class="card-label">% Controle</div>
        <div><span class="card-value" id="val-ctrl">--</span><span class="card-unit">%</span></div>
      </div>
    </div>
  </div>

  <footer>
    <span>Desenvolvido por</span>
    <span class="ft-esl">ESL</span>
    <span class="ft-dot"></span>
    <span class="ft-ver">SKN DEMO V 1.0</span>
    <span class="ft-dot"></span>
    <span class="ft-ver">© 2026</span>
  </footer>

  <script>
    /* ── CLOCK ── */
    const DAYS   = ['DOM','SEG','TER','QUA','QUI','SEX','SAB'];
    const MONTHS = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
    function tick() {
      const n = new Date(), p = v => String(v).padStart(2,'0');
      document.getElementById('hud-clock').textContent = `${p(n.getHours())}:${p(n.getMinutes())}`;
      document.getElementById('hud-date-d').textContent = p(n.getDate());
      document.getElementById('hud-date-m').textContent = `${DAYS[n.getDay()]}  ${MONTHS[n.getMonth()]}  ${n.getFullYear()}`;
    }
    tick(); setInterval(tick, 1000);

    /* ── KEN BURNS FOTOS ── */
    const KBS = ['kb1','kb2','kb3','kb4','kb5'];
    const PHOTO_INTERVAL = 8000, STAGE_LEAD = 3500;
    let photoCurrent = 0, useA = true, stagedIdx = 1, crossTimer = null, stageTimer = null;
    const bgA = document.getElementById('bgA'), bgB = document.getElementById('bgB');
    const validPhotos = [];

    function applyKB(el, anim) { el.style.animation='none'; el.offsetHeight; el.style.animation=`${anim} 14s ease-out forwards`; }

    function crossfade() {
      if (validPhotos.length < 2) return;
      const p = validPhotos[stagedIdx], inc = useA?bgB:bgA, out = useA?bgA:bgB;
      applyKB(inc, p.kb);
      requestAnimationFrame(() => requestAnimationFrame(() => { inc.style.opacity='1'; out.style.opacity='0'; }));
      useA = !useA; photoCurrent = stagedIdx;
      stageTimer = setTimeout(() => {
        stagedIdx = (photoCurrent+1) % validPhotos.length;
        const next = useA?bgB:bgA;
        next.style.backgroundImage = `url('${validPhotos[stagedIdx].src}')`;
        next.style.opacity='0'; next.style.animation='none';
      }, PHOTO_INTERVAL - STAGE_LEAD);
      crossTimer = setTimeout(crossfade, PHOTO_INTERVAL);
    }

    function fotosPlay() {
      if (!validPhotos.length) return;
      const p = validPhotos[photoCurrent];
      bgA.style.backgroundImage = `url('${p.src}')`;
      bgA.style.opacity='1'; bgB.style.opacity='0';
      applyKB(bgA, p.kb);
      if (validPhotos.length > 1) {
        stagedIdx = (photoCurrent+1) % validPhotos.length;
        bgB.style.backgroundImage = `url('${validPhotos[stagedIdx].src}')`;
        bgB.style.opacity='0'; bgB.style.animation='none';
        crossTimer = setTimeout(crossfade, PHOTO_INTERVAL);
      }
    }

    fetch('/api/foto-marketing').then(r=>r.json()).then(files => {
      const photos = files.map((f,i) => ({ src:`/Foto_marketing/${encodeURIComponent(f)}`, kb:KBS[i%KBS.length] }));
      let n = photos.length;
      if (!n) return;
      photos.forEach(p => {
        const img = new Image();
        img.onload  = () => { validPhotos.push(p); if (!--n) fotosPlay(); };
        img.onerror = () => { if (!--n && validPhotos.length) fotosPlay(); };
        img.src = p.src;
      });
    }).catch(() => {});

    /* ── VARIÁVEIS ── */
    let dosadorId = null;

    function setStatus(online) {
      const el = document.getElementById('conn-status');
      el.textContent = online ? '● ONLINE' : '● SEM SINAL';
      el.style.color  = online ? 'rgba(45,212,191,.75)' : 'rgba(239,68,68,.7)';
    }

    async function buscarVariaveis() {
      if (!dosadorId) return;
      try {
        const r = await fetch(`/api/variaveis/${dosadorId}`);
        if (!r.ok) throw new Error();
        const dados = await r.json();
        setStatus(dados.length > 0);
        if (!dados.length) return;
        const m = {};
        dados.forEach(v => { m[v.nome_variavel] = parseFloat(v.valor); });
        const f1 = v => isNaN(v) ? '--' : v.toFixed(1);
        const f2 = v => isNaN(v) ? '--' : v.toFixed(2);
        document.getElementById('val-pressao').textContent    = f1(m.pressao);
        document.getElementById('val-temperatura').textContent = f1(m.temperatura);
        document.getElementById('val-vazao').textContent      = f1(m.vazao);
        document.getElementById('val-ph').textContent         = f2(m.ph);
        document.getElementById('val-setpoint').textContent   = f2(m.setpoint_ph);
        document.getElementById('val-ctrl').textContent       = f1(m.pct_controle);
      } catch { setStatus(false); }
    }

    fetch('/api/dosadores').then(r=>r.json()).then(lista => {
      if (lista.length) {
        dosadorId = lista[0].id;
        buscarVariaveis();
        setInterval(buscarVariaveis, 10000);
      }
    }).catch(() => {});

    /* ── PARTICLES ── */
    const PTYPES=['dot','dot','line','line','hex','hex','dot'], HEX=['FF','2A','C3','0E','7F','B1','A9'];
    for (let i=0;i<7;i++) {
      const el=document.createElement('div'), t=PTYPES[i];
      el.className=`particle ${t}`;
      if (t==='hex') el.textContent=HEX[i];
      const x=(4+Math.random()*92).toFixed(1), y=(10+Math.random()*80).toFixed(1);
      const dur=(6+Math.random()*9).toFixed(1), del=(Math.random()*12).toFixed(2);
      const dx=((Math.random()-.5)*24).toFixed(1);
      const op=(t==='hex'?.4+Math.random()*.25:.25+Math.random()*.4).toFixed(2);
      const sz=t==='line'?(10+Math.random()*18).toFixed(0)+'px':(2+Math.random()*2).toFixed(0)+'px';
      el.style.cssText=`left:${x}%;top:${y}%;--sz:${sz};--pd:${dur}s;--del:${del}s;--dx:${dx}px;--op:${op};`;
      document.body.appendChild(el);
    }
  </script>
</body>
</html>
